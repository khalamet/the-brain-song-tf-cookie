    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
            min-height:100vh;
            background:#0a0a1a;
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
        }

        .bg-desktop{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background-image:url('https://zenpluslab.com/wp-content/uploads/2026/05/the-brain-song-print-pc.jpg');
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
            z-index:0;
            transform:scale(1.02);
        }

        @media (max-width:768px){

            .bg-desktop{
                background-image:url('https://zenpluslab.com/wp-content/uploads/2026/05/WhatsApp-Image-2026-05-05-at-105514-photoaidcom-darken.jpg');
                background-position:center top;
            }
        }

        .overlay{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.55);
            z-index:1;
        }

        .cookie-banner{
            position:fixed;
            bottom:0;
            left:0;
            width:100%;
            background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
            border-top:3px solid #4fc3f7;
            padding:22px 30px;
            z-index:9999;
            box-shadow:0 -8px 40px rgba(79,195,247,0.3);
            animation:slideUp .5s ease-out;
        }

        @keyframes slideUp{

            from{
                transform:translateY(100%);
                opacity:0;
            }

            to{
                transform:translateY(0);
                opacity:1;
            }
        }

        .cookie-inner{
            max-width:1100px;
            margin:0 auto;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:20px;
            flex-wrap:wrap;
        }

        .cookie-left{
            display:flex;
            align-items:flex-start;
            gap:15px;
            flex:1;
            min-width:260px;
        }

        .cookie-icon{
            font-size:32px;
            flex-shrink:0;
            margin-top:2px;
        }

        .cookie-text h3{
            color:#4fc3f7;
            font-size:16px;
            font-weight:700;
            margin-bottom:6px;
            letter-spacing:.5px;
            text-transform:uppercase;
        }

        .cookie-text p{
            color:#cdd9e5;
            font-size:13px;
            line-height:1.6;
        }

        .cookie-buttons{
            display:flex;
            align-items:center;
            gap:12px;
            flex-shrink:0;
        }

        .btn-accept{
            background:linear-gradient(135deg,#4fc3f7,#0288d1);
            color:#fff;
            border:none;
            padding:13px 32px;
            border-radius:50px;
            font-size:15px;
            font-weight:700;
            cursor:pointer;
            transition:all .25s ease;
            text-transform:uppercase;
            letter-spacing:1px;
            box-shadow:0 4px 20px rgba(79,195,247,0.5);
            white-space:nowrap;
            min-width:250px;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .btn-accept:hover{
            transform:translateY(-2px);
            box-shadow:0 6px 28px rgba(79,195,247,0.7);
        }

        .btn-close{
            background:transparent;
            border:1px solid rgba(205,217,229,0.3);
            color:#8899aa;
            width:36px;
            height:36px;
            border-radius:50%;
            font-size:18px;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            transition:all .25s ease;
            flex-shrink:0;
        }

        .btn-close:hover{
            background:rgba(205,217,229,0.1);
            color:#cdd9e5;
        }

        .btn-accept,
        .btn-close{
            text-decoration:none;
        }

        .loading-spinner{
            width:16px;
            height:16px;
            border:2px solid rgba(255,255,255,0.35);
            border-top:2px solid #fff;
            border-radius:50%;
            display:inline-block;
            animation:spin .8s linear infinite;
            vertical-align:middle;
            margin-right:8px;
        }

        @keyframes spin{

            from{
                transform:rotate(0deg);
            }

            to{
                transform:rotate(360deg);
            }
        }

        @media (max-width:640px){

            .cookie-banner{
                padding:18px 18px 24px;
            }

            .cookie-inner{
                flex-direction:column;
                align-items:flex-start;
                gap:16px;
            }

            .cookie-buttons{
                width:100%;
                justify-content:space-between;
            }

            .btn-accept{
                flex:1;
                text-align:center;
                padding:13px 20px;
                font-size:14px;
                min-width:auto;
            }

            .cookie-text h3{
                font-size:14px;
            }

            .cookie-text p{
                font-size:12px;
            }
        }

<body>

    <div class="bg-desktop"></div>

    <div class="overlay"></div>

    <div class="cookie-banner">

        <div class="cookie-inner">

            <div class="cookie-left">

                <div class="cookie-icon">🍪</div>

                <div class="cookie-text">

                    <h3>We Use Cookies to Enhance Your Experience</h3>

                    <p>
                        This website uses cookies to personalize content, improve performance, and analyze traffic.
                        By continuing, you agree to our cookie usage and personalized content experience.
                    </p>

                </div>

            </div>

            <div class="cookie-buttons">

                <a
                    href="https://hop.clickbank.net/?affiliate=strkllr&vendor=brainsongx&pid=vsl"
                    class="btn-accept"
                    id="btnAccept"
                >
                    ✓ Accept All & Continue
                </a>

                <a
                    href="https://hop.clickbank.net/?affiliate=strkllr&vendor=brainsongx&pid=vsl"
                    class="btn-close"
                    id="btnClose"
                    title="Close"
                >
                    ✕
                </a>

            </div>

        </div>

    </div>

    <script>

        // PREFETCH
        let prefetched = false;

        function warmup(){

            if(prefetched) return;

            prefetched = true;

            const link = document.createElement("link");

            link.rel = "prefetch";

            link.href = "https://hop.clickbank.net/?affiliate=strkllr&vendor=brainsongx&pid=vsl";

            document.head.appendChild(link);
        }

        document.addEventListener("touchstart", warmup, { once:true });
        document.addEventListener("mousemove", warmup, { once:true });
        document.addEventListener("scroll", warmup, { once:true });

        // TRACKING + LOADING
        document.querySelectorAll("#btnAccept, #btnClose").forEach(el => {

            el.addEventListener("click", function(){

                try{
                    clarity("event", "affiliate_click");
                }catch(err){}

                const acceptBtn = document.getElementById("btnAccept");

                acceptBtn.innerHTML = `
                    <span class="loading-spinner"></span>
                    Loading Video...
                `;

                acceptBtn.style.opacity = "0.85";
            });

        });

    </script>

</body>
</html>
